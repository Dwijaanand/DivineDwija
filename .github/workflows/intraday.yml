name: DIVINE INTRADAY 

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * 1-5"   # 08:55 AM IST - Warmup
    - cron: "0 4 * * 1-5"    # 09:30 AM IST
    - cron: "0 5 * * 1-5"    # 10:30 AM IST

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: intraday-option-scan
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run DIVINE INTRADAY OPTION MACD
        run: python intraday.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHARK_API_KEY: ${{ secrets.SHARK_API_KEY }}
          SHARK_API_SECRET: ${{ secrets.SHARK_API_SECRET }}
          SHARK_CLIENT_ID: ${{ secrets.SHARK_CLIENT_ID }}
